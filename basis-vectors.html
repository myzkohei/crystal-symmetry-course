<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="stylesheet" href="style.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基底ベクトル｜結晶の対称性と格子</title>
<style>
:root{--bg:#ffffff;--fg:#1f1e1d;--sub:#5f5e5a;--mute:#888780;--line:#d3d1c7;--btn:#f1efe8;--acc:#185FA5}
@media (prefers-color-scheme: dark){:root{--bg:#1f1e1d;--fg:#f1efe8;--sub:#b4b2a9;--mute:#888780;--line:#444441;--btn:#2c2c2a;--acc:#85B7EB}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.lead{font-size:14px;color:var(--sub);margin:0 0 14px}
#btns{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
#btns button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--fg);cursor:pointer}
#btns button.on{border-color:var(--acc);color:var(--acc)}
svg{display:block;width:100%;touch-action:none;cursor:grab}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--sub);margin:6px 0 0}
.sw{display:inline-block;width:20px;vertical-align:middle;margin-right:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
#eq{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.7;margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap}
#info{font-size:14px;line-height:1.7;margin:10px 0 0}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<nav class="top"><a href="index.html">トップ</a><a href="symmetry-matrices.html">対称操作の行列</a><a href="basis-change.html">基底変換 P</a><a href="crystal-systems.html">晶系と格子系</a><a href="cells.html">慣用セルと基本セル</a><a href="basis-vectors.html" class="cur">基底ベクトル</a><a href="vesta-exercises.html">VESTA 演習</a></nav>
<main>
<h1>慣用セルと基本セルの基底ベクトル</h1>
<p class="lead">(a′, b′, c′) = (a, b, c)P。P の列は、基本セルの基底を慣用セルの基底で表した係数。</p>
<div id="btns">
<button data-k="bcc">BCC</button><button data-k="fcc">FCC</button><button data-k="oc">底心（C）</button><button data-k="hp">六方（hP）</button><button data-k="hr">三方（hR）</button>
</div>
<svg id="v" viewBox="0 0 380 340" role="img" aria-label="慣用セルと基本セルの基底ベクトルの立体図"></svg>
<div class="leg">
<span><span class="sw" style="border-top:3px solid #1D9E75"></span>a, b, c（慣用セル）</span>
<span><span class="sw" style="border-top:3px solid #7F77DD"></span>a′, b′, c′（基本セル）</span>
<span><span class="sw" style="border-top:1.5px dashed #7F77DD"></span>基本セルの辺</span>
<span><span class="dot" style="background:#888780"></span>隅の格子点</span>
<span id="lcen"><span class="dot" style="background:#D85A30"></span>中心化による格子点</span>
</div>
<p class="hint">ドラッグで回転できます</p>
<div id="eq"></div>
<p id="info"></p>
</main>
<script>
(function(){
const svg=document.getElementById('v'),NS='http://www.w3.org/2000/svg';
const G='#888780',R='#D85A30',T='#1D9E75',Pc='#7F77DD',s3=Math.sqrt(3)/2;
const add=(p,q)=>p.map((v,i)=>v+q[i]);
const sub=(p,q)=>p.map((v,i)=>v-q[i]);
function para(o,u,v,w){const V=[];for(let i=0;i<8;i++){let p=o.slice();if(i&1)p=add(p,u);if(i&2)p=add(p,v);if(i&4)p=add(p,w);V.push(p);}
const E=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const d=i^j;if(d===1||d===2||d===4)E.push([V[i],V[j]]);}return {V,E};}
const at=(L,c)=>L.map(p=>({p,c}));
const hx=c=>(x,y,z)=>[x-0.5*y,s3*y,z*c];
const O=[0,0,0];
const L={};

(function(){const cube=para(O,[1,0,0],[0,1,0],[0,0,1]);const B=[.5,.5,.5];
const ap=[.5,.5,-.5],bp=[-.5,.5,.5],cp=[.5,-.5,.5];
L.bcc={conv:cube.E,prim:para(B,ap,bp,cp).E,cen:true,
atoms:at(cube.V,G).concat(at([B,[.5,1.5,.5],[1.5,.5,.5],[.5,.5,1.5]],R)),
vecs:[[O,[1,0,0],'a',T],[O,[0,1,0],'b',T],[O,[0,0,1],'c',T],[B,add(B,ap),'a′',Pc],[B,add(B,bp),'b′',Pc],[B,add(B,cp),'c′',Pc]],
eq:"a′ = ( a + b − c)/2\nb′ = (−a + b + c)/2\nc′ = ( a − b + c)/2\n\n      ⎛  1/2  −1/2   1/2 ⎞\n  P = ⎜  1/2   1/2  −1/2 ⎟     det P = 1/2\n      ⎝ −1/2   1/2   1/2 ⎠",
info:"a′, b′, c′ は体心から隅へ向かう体対角線の半分（長さ (√3/2)a、互いのなす角 109.47°）。見やすさのため始点を体心にしている。"};
})();

(function(){const cube=para(O,[1,0,0],[0,1,0],[0,0,1]);
const ap=[0,.5,.5],bp=[.5,0,.5],cp=[.5,.5,0];
L.fcc={conv:cube.E,prim:para(O,ap,bp,cp).E,cen:true,
atoms:at(cube.V,G).concat(at([[.5,.5,0],[.5,.5,1],[.5,0,.5],[.5,1,.5],[0,.5,.5],[1,.5,.5]],R)),
vecs:[[O,[1,0,0],'a',T],[O,[0,1,0],'b',T],[O,[0,0,1],'c',T],[O,ap,'a′',Pc],[O,bp,'b′',Pc],[O,cp,'c′',Pc]],
eq:"a′ = (b + c)/2\nb′ = (a + c)/2\nc′ = (a + b)/2\n\n      ⎛  0    1/2  1/2 ⎞\n  P = ⎜ 1/2    0   1/2 ⎟     det P = 1/4\n      ⎝ 1/2   1/2   0  ⎠",
info:"a′, b′, c′ は隅から 3 つの面心へ向かう面対角線の半分（長さ a/√2、互いのなす角 60°）。"};
})();

(function(){const b=1.5;const box=para(O,[1,0,0],[0,b,0],[0,0,1]);
const ap=[.5,-b/2,0],bp=[.5,b/2,0];
L.oc={conv:box.E,prim:para(O,ap,bp,[0,0,1]).E,cen:true,
atoms:at(box.V,G).concat(at([[.5,b/2,0],[.5,b/2,1],[.5,-b/2,0],[.5,-b/2,1]],R)),
vecs:[[O,[1,0,0],'a',T],[O,[0,b,0],'b',T],[O,[0,0,1],'c = c′',T],[O,ap,'a′',Pc],[O,bp,'b′',Pc]],
eq:"a′ = (a − b)/2\nb′ = (a + b)/2\nc′ = c\n\n      ⎛  1/2  1/2  0 ⎞\n  P = ⎜ −1/2  1/2  0 ⎟     det P = 1/2\n      ⎝   0    0   1 ⎠",
info:"a′, b′ は隅から底面の中心（C 面心）とその隣の C 面心へ向かうベクトル。c′ は c と同じ。直方晶 C 底心の例（b/a = 1.5 は作図用の値）。"};
})();

(function(){const c=1.6,f=hx(c);const V=[],E=[];
const ring=z=>{const r=[];for(let k=0;k<6;k++){const t=k*Math.PI/3;r.push([Math.cos(t),Math.sin(t),z]);}return r;};
const bo=ring(0),to=ring(c);for(let k=0;k<6;k++){E.push([bo[k],bo[(k+1)%6]]);E.push([to[k],to[(k+1)%6]]);E.push([bo[k],to[k]]);}
L.hp={conv:E,prim:para(O,f(1,0,0),f(0,1,0),f(0,0,1)).E,cen:false,
atoms:at(bo.concat(to,[[0,0,0],[0,0,c]]),G),
vecs:[[O,f(1,0,0),'a = a′',T],[O,f(0,1,0),'b = b′',T],[O,f(0,0,1),'c = c′',T]],
eq:"a′ = a,  b′ = b,  c′ = c\n\n  P = E（単位行列）     det P = 1",
info:"六方格子は単純格子なので、慣用セルと基本セルは同じ（灰色の六角柱はその 3 個分）。a と b のなす角は 120°（c/a = 1.6 は作図用の値）。"};
})();

(function(){const c=2.4,f=hx(c);const cell=para(O,f(1,0,0),f(0,1,0),f(0,0,1));
const T1=f(2/3,1/3,1/3),T2=f(-1/3,1/3,1/3),T3=f(-1/3,-2/3,1/3);
L.hr={conv:cell.E,prim:para(O,T1,T2,T3).E,cen:true,
atoms:at(cell.V,G).concat(at([f(2/3,1/3,1/3),f(1/3,2/3,2/3),f(-1/3,1/3,1/3),f(-1/3,-2/3,1/3),f(1/3,-1/3,2/3),f(-2/3,-1/3,2/3)],R)),
vecs:[[O,f(1,0,0),'a',T],[O,f(0,1,0),'b',T],[O,f(0,0,1),'c',T],[O,T1,'a′',Pc],[O,T2,'b′',Pc],[O,T3,'c′',Pc]],
eq:"a′ = ( 2a +  b + c)/3\nb′ = ( −a +  b + c)/3\nc′ = ( −a − 2b + c)/3\n\n      ⎛ 2/3  −1/3  −1/3 ⎞\n  P = ⎜ 1/3   1/3  −2/3 ⎟     det P = 1/3\n      ⎝ 1/3   1/3   1/3 ⎠",
info:"a′, b′, c′ は原点から高さ 1/3 の R 中心化格子点へ向かうベクトル（obverse 配置）。3 本の和 a′ + b′ + c′ = c が菱面体の体対角線で、3 回軸に一致する（c/a = 2.4 は作図用の値）。"};
})();

let cur,C,S,ry=-0.65,rx=0.42;const cx=190,cy=170;
function setL(k){cur=L[k];const P=cur.atoms.map(a=>a.p);cur.conv.concat(cur.prim).forEach(e=>P.push(e[0],e[1]));
const mn=[0,1,2].map(i=>Math.min(...P.map(p=>p[i]))),mx=[0,1,2].map(i=>Math.max(...P.map(p=>p[i])));
C=mn.map((v,i)=>(v+mx[i])/2);const r=Math.max(...P.map(p=>Math.hypot(p[0]-C[0],p[1]-C[1],p[2]-C[2])));S=135/r;
document.getElementById('lcen').style.display=cur.cen?'':'none';
document.getElementById('eq').textContent=cur.eq;document.getElementById('info').textContent=cur.info;
document.querySelectorAll('#btns button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
draw();}
function proj(p){const x=p[0]-C[0],y=p[2]-C[2],z=-(p[1]-C[1]);
const x1=Math.cos(ry)*x+Math.sin(ry)*z,z1=-Math.sin(ry)*x+Math.cos(ry)*z;
const y2=Math.cos(rx)*y-Math.sin(rx)*z1,z2=Math.sin(rx)*y+Math.cos(rx)*z1;return [cx+S*x1,cy-S*y2,z2];}
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function draw(){
svg.innerHTML='<defs><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D9E75"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7F77DD"/></marker></defs>';
cur.conv.forEach(([a,b])=>{const p=proj(a),q=proj(b);svg.appendChild(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:G,'stroke-width':1}));});
cur.prim.forEach(([a,b])=>{const p=proj(a),q=proj(b);svg.appendChild(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:Pc,'stroke-width':1.2,'stroke-dasharray':'4 3'}));});
cur.atoms.map(a=>({a,q:proj(a.p)})).sort((u,v)=>u.q[2]-v.q[2]).forEach(({a,q})=>svg.appendChild(el('circle',{cx:q[0],cy:q[1],r:6.5,fill:a.c,'fill-opacity':0.85})));
cur.vecs.forEach(([s,e,lab,col])=>{const p=proj(s),q=proj(e);
svg.appendChild(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col,'stroke-width':3,'marker-end':col===T?'url(#mt)':'url(#mp)'}));
const d=sub(e,s),n=Math.hypot(...d)||1,Lp=add(e,d.map(v=>v/n*0.22)),t=proj(Lp);
const tx=el('text',{x:t[0],y:t[1]+5,'text-anchor':'middle','font-size':15,'font-style':'italic','font-weight':600,fill:col});tx.textContent=lab;svg.appendChild(tx);});}
document.querySelectorAll('#btns button').forEach(b=>b.addEventListener('click',()=>setL(b.dataset.k)));
let drag=null;
svg.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,ry,rx];svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';});
svg.addEventListener('pointermove',e=>{if(!drag)return;ry=drag[2]+(e.clientX-drag[0])*0.01;rx=Math.max(-1.4,Math.min(1.4,drag[3]+(e.clientY-drag[1])*0.01));draw();});
const end=()=>{drag=null;svg.style.cursor='grab';};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
setL('fcc');
})();
</script>
</body>
</html>
